<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TFB Recettes R&D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
<link rel="stylesheet" href="/assets/style.css">
</head>
<body>
<nav class="topbar">
<div class="topbar-l">
<a href="/" class="logo">THE FRENCH BASTARDS <span>R&D</span></a>
<span class="badge">Recettes existantes</span>
<div class="pagenav">
<a href="/" class="active">Recettes existantes</a>
<a href="/developpement.html">R&D Developpement</a>
</div>
</div>
<div class="topbar-r">
<button class="btn btn-sm" onclick="loadAll()"><i class="ti ti-refresh"></i> Actualiser</button>
</div>
</nav>
<div class="main">
<div class="conn" id="conn">
<div class="dot" id="dot"></div>
<div style="flex:1;font-size:13px;color:var(--tx2)" id="conn-txt">Connexion a Inpulse...</div>
</div>
<div class="metrics" id="metrics"></div>
<div class="filters">
<div class="fg" id="statusFilter">
<button class="fgb active" data-v="all">Toutes</button>
<button class="fgb" data-v="active">Actives</button>
<button class="fgb" data-v="inactive">Inactives</button>
</div>
<select id="catFilter"><option value="all">Toutes categories</option></select>
<div class="sw"><i class="ti ti-search"></i><input class="si" id="search" type="text" placeholder="Rechercher une recette..."></div>
</div>
<div class="section">
<div class="sh"><div class="st">Recettes par categorie</div><div class="sm" id="countTxt"></div></div>
<div class="tw">
<table>
<thead><tr><th>Nom</th><th>Cout total HT</th><th>Prix final TTC</th><th>Food cost brut</th><th>Statut</th><th></th></tr></thead>
<tbody id="tbody"><tr><td colspan="6" class="loading-row">Chargement...</td></tr></tbody>
</table>
</div>
</div>
</div>
<script src="/assets/app.js"></script>
<script>
var ENDPOINTS = { recipes: '/public/v2/recipes', products: '/public/v2/products', ingredients: '/public/v2/ingredients', supplierProducts: '/public/v2/supplier-products' };
var ALL = [];
var PRODUCTS_BY_ENTITY = {};
var INGR_BY_ID = {};
var SUPPRODUCT_BY_ID = {};
var QUALITY_MAP = {};
var DETAIL_CACHE = {};
var currentStatus = 'all';
var COLLAPSED_CATS = {};
var QUALITY_OPTIONS = ['A definir', 'Standard', 'Bio', 'Premium', 'Local', 'A ameliorer'];

function fetchAllPages(endpoint) {
  return apiGet(endpoint, { limit: 100, skip: 0 }).then(function (first) {
    var total = first.total || (first.data || []).length;
    var data = (first.data || []).slice();
    var calls = [];
    for (var skip = 100; skip < total; skip += 100) {
      calls.push(apiGet(endpoint, { limit: 100, skip: skip }));
    }
    if (!calls.length) return data;
    return Promise.all(calls).then(function (pages) {
      pages.forEach(function (p) { data = data.concat(p.data || []); });
      return data;
    });
  });
}

function getName(r) { return r.name || '(sans nom)'; }
function getCategory(r) { return r.category || 'Sans categorie'; }
function isActive(r) { return r.status === 'active'; }
function getUnitLabel(u) { if (!u) return ''; if (u === 'unit') return 'unite'; return u; }
function getCostTotal(r) { return (Number(r.costOnSite) || 0) * (Number(r.quantity) || 1); }
function getProduct(r) { return PRODUCTS_BY_ENTITY[r.id] || null; }
function getPriceInfo(r) {
  var p = getProduct(r);
  if (!p || !p.priceWithTaxes) return null;
  var vat = Number(p.vatRate) || 0;
  var priceHT = p.priceWithTaxes / (1 + vat / 100);
  return { ttc: p.priceWithTaxes, ht: priceHT, vat: vat };
}
function getFoodCostPct(r) {
  var pi = getPriceInfo(r);
  if (!pi || !pi.ht) return null;
  var cost = getCostTotal(r);
  return (cost / pi.ht) * 100;
}
function fcClass(pct) {
  if (pct == null) return '';
  if (pct <= 25) return 'good';
  if (pct <= 35) return 'warn';
  return 'bad';
}
function getFlag(r, cost, pi, pct) {
  if (!pi) return null;
  if (pct != null && pct > 60) return 'Prix a verifier';
  if (cost === 0) return 'Composition manquante';
  return null;
}

function loadAll() {
  document.getElementById('conn-txt').textContent = 'Connexion a Inpulse...';
  document.getElementById('dot').className = 'dot spin';
  Promise.all([
    fetchAllPages(ENDPOINTS.recipes),
    fetchAllPages(ENDPOINTS.products),
    fetchAllPages(ENDPOINTS.ingredients),
    fetchAllPages(ENDPOINTS.supplierProducts),
    qualityGetAll().catch(function () { return {}; })
  ]).then(function (results) {
    ALL = results[0];
    var products = results[1];
    var ingredients = results[2];
    var supplierProducts = results[3];
    QUALITY_MAP = results[4] || {};
    PRODUCTS_BY_ENTITY = {};
    products.forEach(function (p) { if (p.entityId) PRODUCTS_BY_ENTITY[p.entityId] = p; });
    INGR_BY_ID = {};
    ingredients.forEach(function (i) { INGR_BY_ID[i.id] = i; });
    SUPPRODUCT_BY_ID = {};
    supplierProducts.forEach(function (s) { SUPPRODUCT_BY_ID[s.id] = s; });
    document.getElementById('dot').className = 'dot ok';
    document.getElementById('conn-txt').textContent = ALL.length + ' recettes, ' + ingredients.length + ' ingredients, ' + supplierProducts.length + ' produits fournisseurs charges';
    populateCategories();
    render();
  }).catch(function (e) {
    document.getElementById('dot').className = 'dot err';
    document.getElementById('conn-txt').textContent = 'Impossible de recuperer les donnees depuis Inpulse.';
    document.getElementById('tbody').innerHTML = '<tr><td colspan="6" class="loading-row">Aucune donnee</td></tr>';
  });
}

function populateCategories() {
  var cats = {};
  ALL.forEach(function (r) { cats[getCategory(r)] = true; });
  var sel = document.getElementById('catFilter');
  sel.innerHTML = '<option value="all">Toutes categories</option>';
  Object.keys(cats).sort().forEach(function (c) {
    var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
  });
}

document.addEventListener('click', function (e) {
  var b = e.target.closest('#statusFilter .fgb');
  if (b) {
    document.querySelectorAll('#statusFilter .fgb').forEach(function (x) { x.classList.remove('active'); });
    b.classList.add('active');
    currentStatus = b.dataset.v;
    render();
    return;
  }
  var catRow = e.target.closest('.cat-row');
  if (catRow) {
    var cat = catRow.dataset.cat;
    COLLAPSED_CATS[cat] = !COLLAPSED_CATS[cat];
    render();
    return;
  }
  var recRow = e.target.closest('.recipe-row');
  if (recRow) {
    toggleRecipe(recRow.dataset.id);
    return;
  }
});

document.addEventListener('change', function (e) {
  var sel = e.target.closest('select.qsel');
  if (sel) {
    var id = sel.dataset.id;
    var value = sel.value;
    QUALITY_MAP[id] = Object.assign({}, QUALITY_MAP[id], { quality: value });
    qualitySet(id, { quality: value }).then(function () { toast('Qualite mise a jour'); }).catch(function () { toast('Erreur de sauvegarde'); });
  }
});

function groupByCategory(list) {
  var groups = {};
  var order = [];
  list.forEach(function (r) {
    var c = getCategory(r);
    if (!groups[c]) { groups[c] = []; order.push(c); }
    groups[c].push(r);
  });
  order.sort(function (a, b) {
    var aNone = a === 'Sans categorie';
    var bNone = b === 'Sans categorie';
    if (aNone && !bNone) return 1;
    if (bNone && !aNone) return -1;
    return a.localeCompare(b);
  });
  order.forEach(function (c) {
    groups[c].sort(function (a, b) { return getName(a).localeCompare(getName(b)); });
  });
  return { groups: groups, order: order };
}

function render() {
  var status = currentStatus;
  var cat = document.getElementById('catFilter').value;
  var q = document.getElementById('search').value.toLowerCase();
  var filtered = ALL.filter(function (r) {
    var active = isActive(r);
    if (status === 'active' && !active) return false;
    if (status === 'inactive' && active) return false;
    if (cat !== 'all' && getCategory(r) !== cat) return false;
    if (q && getName(r).toLowerCase().indexOf(q) === -1) return false;
    return true;
  });
  document.getElementById('countTxt').textContent = filtered.length + ' / ' + ALL.length;
  var g = groupByCategory(filtered);
  var html = '';
  g.order.forEach(function (catName) {
    var rows = g.groups[catName];
    var collapsed = !!COLLAPSED_CATS[catName];
    html += '<tr class="cat-row' + (collapsed ? ' collapsed' : '') + '" data-cat="' + escapeHtml(catName) + '">' +
      '<td colspan="6"><i class="ti ti-chevron-down chev"></i>' + escapeHtml(catName) +
      '<span class="cnt">(' + rows.length + ' recette' + (rows.length > 1 ? 's' : '') + ')</span></td></tr>';
    rows.forEach(function (r) {
      var cost = getCostTotal(r);
      var pi = getPriceInfo(r);
      var pct = getFoodCostPct(r);
      var cls = fcClass(pct);
      var flag = getFlag(r, cost, pi, pct);
      html += '<tr class="recipe-row' + (collapsed ? ' hidden' : '') + '" data-id="' + r.id + '" data-cat="' + escapeHtml(catName) + '">' +
        '<td class="tb name"><i class="ti ti-chevron-right exp-chev" id="chev-' + r.id + '"></i> ' + escapeHtml(getName(r)) + '</td>' +
        '<td class="num">' + fmtEUR(cost) + '</td>' +
        '<td class="num">' + (pi ? fmtEUR(pi.ttc) : '—') + '</td>' +
        '<td class="num"><span class="fc-val ' + cls + '">' + (pct != null ? fmtPct(pct) : '—') + '</span>' + (flag ? ' <span class="flag-pill" title="' + escapeHtml(flag) + '">⚠</span>' : '') + '</td>' +
        '<td>' + (isActive(r) ? '<span class="pill ok">Active</span>' : '<span class="pill ko">Inactive</span>') + '</td>' +
        '<td></td></tr>';
    });
  });
  document.getElementById('tbody').innerHTML = html || '<tr><td colspan="6" class="loading-row">Aucune recette ne correspond aux filtres</td></tr>';
  renderMetrics();
}

function renderMetrics() {
  var total = ALL.length;
  var actives = ALL.filter(isActive).length;
  var inactives = total - actives;
  var cats = {}; ALL.forEach(function (r) { if (r.category) cats[r.category] = true; });
  var flagged = 0;
  var pcts = [];
  ALL.forEach(function (r) {
    var cost = getCostTotal(r);
    var pi = getPriceInfo(r);
    var pct = getFoodCostPct(r);
    if (pct != null) pcts.push(pct);
    if (getFlag(r, cost, pi, pct)) flagged++;
  });
  var avgPct = pcts.length ? (pcts.reduce(function (s, v) { return s + v; }, 0) / pcts.length) : 0;
  document.getElementById('metrics').innerHTML =
    '<div class="metric"><div class="ml">Recettes</div><div class="mv">' + total + '</div></div>' +
    '<div class="metric accent"><div class="ml">Actives</div><div class="mv">' + actives + '</div></div>' +
    '<div class="metric"><div class="ml">Inactives</div><div class="mv">' + inactives + '</div></div>' +
    '<div class="metric"><div class="ml">Categories</div><div class="mv">' + Object.keys(cats).length + '</div></div>' +
    '<div class="metric"><div class="ml">Food cost brut moyen</div><div class="mv">' + fmtPct(avgPct) + '</div></div>' +
    '<div class="metric' + (flagged ? ' warn-metric' : '') + '"><div class="ml">A verifier</div><div class="mv">' + flagged + '</div></div>';
}

function getRecipeDetail(id) {
  if (DETAIL_CACHE[id]) return DETAIL_CACHE[id];
  var p = apiGet('/public/v2/recipes/' + id, { compositionDetailsLevel: 'full' }).then(function (resp) {
    return { ok: true, data: resp.data };
  }).catch(function () {
    return { ok: false, data: null };
  });
  DETAIL_CACHE[id] = p;
  return p;
}

function getSupplierName(id) {
  var ing = INGR_BY_ID[id];
  if (!ing || !ing.supplierProducts || !ing.supplierProducts.length) return null;
  var sp = SUPPRODUCT_BY_ID[ing.supplierProducts[0].id];
  if (sp && sp.supplier && sp.supplier.name) return sp.supplier.name;
  return null;
}

function leafFromLine(line, qty) {
  var unitCost = (typeof line.costOnSite === 'number') ? line.costOnSite : (typeof line.cost === 'number' ? line.cost : 0);
  var lineCost = unitCost * qty;
  var ing = INGR_BY_ID[line.id];
  var opaque = !ing;
  var supplierName = getSupplierName(line.id);
  return {
    id: line.id,
    name: line.name,
    quantity: qty,
    unit: getUnitLabel(line.unit),
    unitCost: unitCost,
    lineCost: lineCost,
    supplier: supplierName || (opaque ? 'Fabrication interne' : 'Non renseigne'),
    opaque: opaque
  };
}

function expandLine(line, ratio, depth) {
  var qty = (Number(line.quantity) || 0) * ratio;
  if (depth > 6) return Promise.resolve([leafFromLine(line, qty)]);
  return getRecipeDetail(line.id).then(function (det) {
    if (det.ok && det.data && Array.isArray(det.data.composition) && det.data.composition.length) {
      var yieldQty = Number(det.data.quantity) || 1;
      var subRatio = qty / yieldQty;
      return Promise.all(det.data.composition.map(function (child) { return expandLine(child, subRatio, depth + 1); })).then(function (childResults) {
        return [].concat.apply([], childResults);
      });
    }
    return [leafFromLine(line, qty)];
  });
}

function getFlatIngredients(recipe) {
  return getRecipeDetail(recipe.id).then(function (det) {
    if (!det.ok || !det.data || !Array.isArray(det.data.composition)) return [];
    return Promise.all(det.data.composition.map(function (child) { return expandLine(child, 1, 1); })).then(function (results) {
      var flat = [].concat.apply([], results);
      var map = {};
      var order = [];
      flat.forEach(function (row) {
        var key = row.id || (row.name + '|' + row.unit);
        if (!map[key]) { map[key] = Object.assign({}, row); order.push(key); }
        else { map[key].quantity += row.quantity; map[key].lineCost += row.lineCost; }
      });
      return order.map(function (k) { return map[k]; });
    });
  });
}

function toggleRecipe(id) {
  var row = document.querySelector('.recipe-row[data-id="' + id + '"]');
  if (!row) return;
  var next = row.nextElementSibling;
  var chev = document.getElementById('chev-' + id);
  if (next && next.classList.contains('expand-row')) {
    next.remove();
    if (chev) chev.className = 'ti ti-chevron-right exp-chev';
    return;
  }
  document.querySelectorAll('.expand-row').forEach(function (n) { n.remove(); });
  document.querySelectorAll('.exp-chev').forEach(function (c) { c.className = 'ti ti-chevron-right exp-chev'; });
  if (chev) chev.className = 'ti ti-chevron-down exp-chev';
  var tr = document.createElement('tr');
  tr.className = 'expand-row';
  tr.innerHTML = '<td colspan="6"><div class="exp-wrap"><div class="loading-row">Chargement des ingredients...</div></div></td>';
  row.parentNode.insertBefore(tr, row.nextSibling);
  var r = ALL.filter(function (x) { return x.id === id; })[0];
  getFlatIngredients(r).then(function (rows) {
    tr.querySelector('.exp-wrap').innerHTML = buildExpandHtml(r, rows);
  }).catch(function () {
    tr.querySelector('.exp-wrap').innerHTML = '<div class="loading-row">Erreur de chargement des ingredients</div>';
  });
}

function buildExpandHtml(r, rows) {
  var cost = getCostTotal(r);
  var pi = getPriceInfo(r);
  var pct = getFoodCostPct(r);
  var cls = fcClass(pct);
  var flag = getFlag(r, cost, pi, pct);
  var hasOpaque = rows.some(function (x) { return x.opaque; });
  var head = '<div class="exp-head">' +
    '<span>Composants : <b>' + rows.length + '</b></span>' +
    '<span>Cout total HT : <b>' + fmtEUR(cost) + '</b></span>' +
    '<span>Prix final TTC : <b>' + (pi ? fmtEUR(pi.ttc) : '—') + '</b></span>' +
    '<span>Food cost brut : <b class="fc-val ' + cls + '">' + (pct != null ? fmtPct(pct) : '—') + '</b>' + (flag ? ' <span class="flag-pill" title="' + escapeHtml(flag) + '">⚠ ' + escapeHtml(flag) + '</span>' : '') + '</span>' +
    '</div>';
  if (hasOpaque) {
    head += '<div class="opaque-note"><i class="ti ti-info-circle"></i> Certains composants sont des sous-recettes fabriquees en interne (laboratoire) : le detail de leurs ingredients ne peut pas etre affiche car Inpulse ne l expose pas via son API publique. Ils sont affiches tels quels ci-dessous.</div>';
  }
  var bodyRows = rows.map(function (c) {
    var qsel = '<select class="qsel" data-id="' + c.id + '"><option value="">Non renseignee</option>' +
      QUALITY_OPTIONS.map(function (o) {
        var cur = (QUALITY_MAP[c.id] && QUALITY_MAP[c.id].quality) || '';
        return '<option value="' + o + '"' + (cur === o ? ' selected' : '') + '>' + o + '</option>';
      }).join('') + '</select>';
    return '<tr' + (c.opaque ? ' class="opaque-row"' : '') + '><td>' + escapeHtml(c.name) + (c.opaque ? ' <span class="tag-internal">sous-recette</span>' : '') + '</td><td>' + escapeHtml(c.supplier) + '</td><td class="num">' + fmtNum(c.quantity) + '</td><td>' + escapeHtml(c.unit) + '</td><td class="num">' + fmtEUR(c.lineCost) + '</td><td>' + qsel + '</td></tr>';
  }).join('');
  var table = '<div class="tw"><table><thead><tr><th>Ingredient</th><th>Fournisseur</th><th>Quantite</th><th>Unite</th><th>Cout HT</th><th>Qualite</th></tr></thead><tbody>' +
    (bodyRows || '<tr><td colspan="6" class="loading-row">Aucun composant</td></tr>') + '</tbody></table></div>';
  return head + table;
}

document.getElementById('catFilter').addEventListener('change', render);
document.getElementById('search').addEventListener('input', debounce(render, 200));
loadAll();
</script>
</body>
</html>
