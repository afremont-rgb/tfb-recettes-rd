<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TFB Recettes R&D - Developpement</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
  <link rel="stylesheet" href="/assets/style.css">
  </head>
<body>
  <nav class="topbar">
    <div class="topbar-l">
      <a href="/" class="logo"><img src="https://thefrenchbastards.fr/media/site/07b0334dcf-1732087927/header-logo-300x.png" alt="The French Bastards" class="logo-img"></a>
      <span class="badge">R&D Developpement</span>
      <div class="pagenav">
        <a href="/">Recettes existantes</a>
        <a href="/developpement.html" class="active">R&D Developpement</a>
      </div>
    </div>
    <div class="topbar-r">
      <button class="btn btn-sm" onclick="loadAll(true)"><i class="ti ti-refresh"></i> Actualiser</button>
      <button class="btn btn-gold btn-sm" onclick="openCreate()"><i class="ti ti-plus"></i> Nouvelle recette</button>
    </div>
  </nav>
  <div class="progresswrap" id="progresswrap">
    <div class="progresstxt" id="progresstxt">Chargement...</div>
    <div class="progressbar"><div class="progressfill" id="progressfill" style="width:0%"></div></div>
    <div class="progresstxt" id="progresspct">0%</div>
  </div>
  <div class="main">
    <div class="conn" id="conn">
      <div class="dot" id="dot"></div>
      <div style="flex:1;font-size:13px;color:var(--tx2)" id="conn-txt">Connexion a Inpulse...</div>
    </div>
    <div class="metrics" id="metrics"></div>
    <div class="filters">
      <div class="fg" id="statusFilter">
        <button class="fgb active" data-v="all">Toutes</button>
        <button class="fgb" data-v="active">Actives</button>
        <button class="fgb" data-v="inactive">Inactives</button>
      </div>
      <select id="catFilter"><option value="all">Toutes categories</option></select>
      <div class="sw"><i class="ti ti-search"></i><input class="si" id="search" type="text" placeholder="Rechercher une recette..."></div>
    </div>
    <div class="section">
      <div class="sh"><div class="st">Recettes en R&D (sans prix de vente Inpulse)</div><div class="sm" id="countTxt"></div></div>
      <div id="accordionWrap"><div class="loading-row">Chargement...</div></div>
    </div>
    <div class="section">
      <div class="sh"><div class="st">Brouillons R&D (crees ici)</div><div class="sm" id="countTxt2"></div></div>
      <div class="tw">
        <table>
          <thead><tr><th>Nom</th><th>Categorie</th><th>Prix vente</th><th>Food cost</th><th>Statut</th><th></th></tr></thead>
        <tbody id="tbody2"><tr><td colspan="6" class="loading-row">Chargement...</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
<div id="modalRoot"></div>
  <script src="/assets/app.js"></script><script>
  var ALL = [];
  var PRODUCTS_BY_ENTITY = {};
  var INGR_BY_ID = {};
  var SUPPRODUCT_BY_ID = {};
  var HIDDEN_RECIPES = {};
  var RECIPE_BY_ID = {};
  var USERS_MAP = {};
  var CLS_BY_ID = {};
  var BUCKETS_BY_ID = {};
  var OPTIM_RESULTS = {};
  var currentStatus = 'all';
  var COLLAPSED_MACRO = {};
  var STATE = { DETAIL_CACHE: {}, RECIPE_DETAIL_DATA: {}, INGR_BY_ID: {}, SUPPRODUCT_BY_ID: {} };
  var HELPERS = null;
  var DRAFTS = {};
  var INGREDIENTS_LIST = [];
  var currentDraftId = null;
  var currentIngredients = [];

  function updateProgress(pct, label) {
    var fill = document.getElementById('progressfill');
    var pctEl = document.getElementById('progresspct');
    var txt = document.getElementById('progresstxt');
    if (fill) fill.style.width = Math.max(0, Math.min(100, pct)) + '%';
    if (pctEl) pctEl.textContent = Math.round(pct) + '%';
    if (txt && label) txt.textContent = label;
  }

  function isUserHidden(r) { return !!(HIDDEN_RECIPES && HIDDEN_RECIPES[r.id] && HIDDEN_RECIPES[r.id].hidden); }

  function classifyAll() {
                            RECIPE_BY_ID = {};
    ALL.forEach(function (r) { RECIPE_BY_ID[r.id] = r; });
    CLS_BY_ID = {};
    ALL.forEach(function (r) { CLS_BY_ID[r.id] = coreClassify(r, PRODUCTS_BY_ENTITY); });
  }

  function computeBuckets() {
    BUCKETS_BY_ID = {};
    ALL.forEach(function (r) {
      if (CLS_BY_ID[r.id] === 'sous-recette') {
        BUCKETS_BY_ID[r.id] = coreUsageBuckets(r.id, USERS_MAP, RECIPE_BY_ID, PRODUCTS_BY_ENTITY);
  }
    });
  }

  function belongsRD(r) {
    var cls = CLS_BY_ID[r.id];
    if (cls === 'rd') return true;
    if (cls === 'sous-recette') return !!(BUCKETS_BY_ID[r.id] && BUCKETS_BY_ID[r.id].rd);
    return false;
  }

  function visibleList() {
    return ALL.filter(function (r) { return belongsRD(r) && !isUserHidden(r); });
  }

  function getCostTotal(r) { return coreGetCostTotal(r); }
  function isActive(r) { return coreIsActive(r); }
  function isSousRecette(r) { return CLS_BY_ID[r.id] === 'sous-recette'; }

  function getFlag(r, cost) {
    if (cost === 0) return 'Composition manquante';
    return null;
  }
  
function readCache() { return sharedReadCache(); }

  function applyLoadedData(d) {
  ALL = d.ALL || [];
  PRODUCTS_BY_ENTITY = d.PRODUCTS_BY_ENTITY || {};
  INGR_BY_ID = d.INGR_BY_ID || {};
  SUPPRODUCT_BY_ID = d.SUPPRODUCT_BY_ID || {};
  HIDDEN_RECIPES = d.HIDDEN_RECIPES || {};
  USERS_MAP = d.USERS_MAP || {};
  STATE.RECIPE_DETAIL_DATA = d.RECIPE_DETAIL_DATA || {};
  STATE.INGR_BY_ID = INGR_BY_ID;
  STATE.SUPPRODUCT_BY_ID = SUPPRODUCT_BY_ID;
  HELPERS = coreMakeIngredientHelpers(STATE);
  classifyAll();
  computeBuckets();
  }

  function fmtCacheAge(ts) {
  var mins = Math.round((Date.now() - ts) / 60000);
  if (mins < 60) return 'il y a ' + mins + ' min';
    var hrs = Math.round(mins / 60);
    if (hrs < 24) return 'il y a ' + hrs + ' h';
      var days = Math.round(hrs / 24);
      return 'il y a ' + days + ' j';
      }

      function loadAll(force) {
      var cached = !force ? readCache() : null;
      if (cached && cached.USERS_MAP) {
      applyLoadedData(cached);
      document.getElementById('dot').className = 'dot ok';
      document.getElementById('conn-txt').textContent = ALL.length + ' recettes (cache local, actualise ' + fmtCacheAge(cached._savedAt) + ')';
      updateProgress(100, 'Cache local charge');
      document.getElementById('progresswrap').classList.add('done');
      populateCategories();
      render();
      loadDrafts().then(renderDrafts);
      var age = Date.now() - cached._savedAt;
      if (age > SHARED_CACHE_MAX_AGE) setTimeout(function () { fetchFresh(true); }, 400);
      return;
      }
      fetchFresh(false);
      loadDrafts().then(renderDrafts);
      }

      function fetchFresh(silent) {
      if (!silent) {
      document.getElementById('conn-txt').textContent = 'Connexion a Inpulse...';
      document.getElementById('dot').className = 'dot spin';
      document.getElementById('progresswrap').classList.remove('done');
      }
      updateProgress(2, silent ? 'Actualisation en arriere-plan...' : 'Connexion...');
      Promise.all([
      fetchAllPages(ENDPOINTS.recipes),
      fetchAllPages(ENDPOINTS.products),
      fetchAllPages(ENDPOINTS.ingredients),
      fetchAllPages(ENDPOINTS.supplierProducts),
      hiddenRecipeGetAll().catch(function () { return {}; })
      ]).then(function (results) {
      ALL = results[0];
      var products = results[1];
      var ingredients = results[2];
      var supplierProducts = results[3];
      HIDDEN_RECIPES = results[4] || {};
      INGREDIENTS_LIST = ingredients;
      PRODUCTS_BY_ENTITY = {};
      products.forEach(function (p) { if (p.entityId) PRODUCTS_BY_ENTITY[p.entityId] = p; });
      INGR_BY_ID = {};
      ingredients.forEach(function (i) { INGR_BY_ID[i.id] = i; });
      SUPPRODUCT_BY_ID = {};
      supplierProducts.forEach(function (s) { SUPPRODUCT_BY_ID[s.id] = s; });
      STATE = { DETAIL_CACHE: {}, RECIPE_DETAIL_DATA: {}, INGR_BY_ID: INGR_BY_ID, SUPPRODUCT_BY_ID: SUPPRODUCT_BY_ID };
      HELPERS = coreMakeIngredientHelpers(STATE);
      classifyAll();
      document.getElementById('dot').className = 'dot ok';
      document.getElementById('conn-txt').textContent = ALL.length + ' recettes chargees depuis Inpulse. Analyse des sous-recettes en cours...';
      updateProgress(20, 'Analyse des sous-recettes...');
      coreBuildUsageGraph(ALL, HELPERS.getRecipeDetail, function (done, total) {
      updateProgress(20 + (done / total) * 60, 'Analyse des sous-recettes : ' + done + '/' + total);
      }).then(function (usersMap) {
      USERS_MAP = usersMap;
      computeBuckets();
      document.getElementById('conn-txt').textContent = ALL.length + ' recettes, ' + ingredients.length + ' ingredients, ' + supplierProducts.length + ' produits fournisseurs charges';
      updateProgress(85, 'Construction de l affichage...');
      populateCategories();
      render();
      updateProgress(100, 'Pret');
      sharedSaveCache({
      ALL: ALL, PRODUCTS_BY_ENTITY: PRODUCTS_BY_ENTITY, INGR_BY_ID: INGR_BY_ID, SUPPRODUCT_BY_ID: SUPPRODUCT_BY_ID,
      HIDDEN_RECIPES: HIDDEN_RECIPES, USERS_MAP: USERS_MAP, RECIPE_DETAIL_DATA: STATE.RECIPE_DETAIL_DATA
      });
      setTimeout(function () { document.getElementById('progresswrap').classList.add('done'); }, 900);
      setTimeout(startOptimScan, 500);
      });
      }).catch(function (e) {
      if (!silent) {
      document.getElementById('dot').className = 'dot err';
      document.getElementById('conn-txt').textContent = 'Impossible de recuperer les donnees depuis Inpulse.';
      document.getElementById('accordionWrap').innerHTML = '<div class="loading-row">Aucune donnee</div>';
      updateProgress(100, 'Erreur');
      }
      });
      }

      function populateCategories() {
      var cats = {};
      visibleList().forEach(function (r) { cats[coreGetCategory(r)] = true; });
      var sel = document.getElementById('catFilter');
      var prev = sel.value;
      sel.innerHTML = '<option value="all">Toutes categories</option>';
      Object.keys(cats).sort().forEach(function (c) {
      var o = document.createElement('option'); o.value = c; o.textContent = c; sel.appendChild(o);
      });
      sel.value = prev && cats[prev] ? prev : 'all';
      }

      function buildGroups(list) {
      var g = {};
      CORE_MACRO_ORDER.forEach(function (m) { g[m] = { active: { Paris: [], Bordeaux: [] }, inactive: { Paris: [], Bordeaux: [] } }; });
      list.forEach(function (r) {
      var m = coreMacroOf(r);
      var st = isActive(r) ? 'active' : 'inactive';
      var site = coreSiteOf(r);
      if (!g[m][st][site]) g[m][st][site] = [];
      g[m][st][site].push(r);
      });
      return g;
      }

      document.addEventListener('click', function (e) {
      var b = e.target.closest('#statusFilter .fgb');
      if (b) {
      document.querySelectorAll('#statusFilter .fgb').forEach(function (x) { x.classList.remove('active'); });
      b.classList.add('active');
      currentStatus = b.dataset.v;
      render();
      return;
      }
      var macroHead = e.target.closest('.macro-head');
      if (macroHead) {
      var m = macroHead.dataset.macro;
      COLLAPSED_MACRO[m] = (COLLAPSED_MACRO[m] === false) ? true : false;
      render();
      return;
      }
      var recRow = e.target.closest('.recipe-row');
      if (recRow) {
      toggleRecipe(recRow.dataset.id);
      return;
      }
      var ingRow = e.target.closest('.ingr-row[data-ing]');
      if (ingRow) {
      var next = ingRow.nextElementSibling;
      if (next && next.classList.contains('ingr-detail-row')) {
      next.remove();
      var ch = ingRow.querySelector('.ing-chev');
      if (ch) ch.className = 'ti ti-chevron-right ing-chev';
      return;
      }
      document.querySelectorAll('.ingr-detail-row').forEach(function (n) { n.remove(); });
      document.querySelectorAll('.ing-chev').forEach(function (c) { c.className = 'ti ti-chevron-right ing-chev'; });
      var ch2 = ingRow.querySelector('.ing-chev');
      if (ch2) ch2.className = 'ti ti-chevron-down ing-chev';
      var tr2 = document.createElement('tr');
      tr2.className = 'ingr-detail-row';
      tr2.innerHTML = '<td colspan="5">' + buildIngredientDetailHtml(ingRow.dataset.ing) + '</td>';
      ingRow.parentNode.insertBefore(tr2, ingRow.nextSibling);
      return;
      }
      });

      function renderRecipeTable(rows) {
      var trs = rows.map(function (r) {
      var cost = getCostTotal(r);
      var flag = getFlag(r, cost);
      var sousTag = isSousRecette(r) ? ' <span class="tag-internal">sous-recette</span>' : '';
      var optim = OPTIM_RESULTS[r.id];
      var hasOptim = optim && optim.length;
      return '<tr class="recipe-row' + (hasOptim ? ' row-optim' : '') + '" data-id="' + r.id + '">' +
        '<td class="tb name"><i class="ti ti-chevron-right exp-chev" id="chev-' + r.id + '"></i> ' + escapeHtml(coreGetName(r)) + sousTag + (hasOptim ? ' <span class="optim-pill" title="Alternative fournisseur moins chere disponible (estimation)">eco</span>' : '') + '</td>' +
        '<td class="num">' + fmtEUR(cost) + '</td>' +
        '<td style="text-align:center">' + (flag ? '<span class="flag-pill" title="' + escapeHtml(flag) + '">!</span>' : '') + '</td>' +
        '<td>' + (isActive(r) ? '<span class="pill ok">Active</span>' : '<span class="pill ko">Inactive</span>') + '</td>' +
    '</tr>';
    }).join('');
    return '<div class="tw"><table><colgroup><col style="width:52%"><col style="width:20%"><col style="width:12%"><col style="width:16%"></colgroup>' +
    '<thead><tr><th>Nom</th><th class="num">Cout global HT</th><th style="text-align:center">Alerte</th><th>Statut</th></tr></thead>' +
    '<tbody>' + trs + '</tbody></table></div>';
    }
    
    function render() {
    var status = currentStatus;
    var cat = document.getElementById('catFilter').value;
    var q = document.getElementById('search').value.toLowerCase();
    var base = visibleList();
    var filtered = base.filter(function (r) {
    var active = isActive(r);
    if (status === 'active' && !active) return false;
    if (status === 'inactive' && active) return false;
    if (cat !== 'all' && coreGetCategory(r) !== cat) return false;
    if (q && coreGetName(r).toLowerCase().indexOf(q) === -1) return false;
    return true;
    });
    document.getElementById('countTxt').textContent = filtered.length + ' / ' + base.length;
    var groups = buildGroups(filtered);
    var html = '';
    CORE_MACRO_ORDER.forEach(function (m) {
    var g = groups[m];
    var total = g.active.Paris.length + g.active.Bordeaux.length + g.inactive.Paris.length + g.inactive.Bordeaux.length;
    if (!total) return;
    var collapsed = COLLAPSED_MACRO[m] !== false;
    html += '<div class="macro-cat">';
    html += '<div class="macro-head' + (collapsed ? '' : ' open') + '" data-macro="' + m + '"><i class="ti ti-chevron-right chev"></i><span class="macro-title">' + escapeHtml(CORE_MACRO_LABELS[m]) + '</span><span class="cnt">(' + total + ' recette' + (total > 1 ? 's' : '') + ')</span></div>';
    html += '<div class="macro-body" style="display:' + (collapsed ? 'none' : 'block') + '">';
    ['active', 'inactive'].forEach(function (st) {
    var stLabel = st === 'active' ? 'Actives' : 'Inactives';
    var stTotal = g[st].Paris.length + g[st].Bordeaux.length;
    if (!stTotal) return;
    html += '<div class="sub-block"><div class="sub-title">' + stLabel + ' (' + stTotal + ')</div>';
    ['Paris', 'Bordeaux'].forEach(function (site) {
    var rows = g[st][site];
    if (!rows.length) return;
    rows.sort(function (a, b) { return coreGetName(a).localeCompare(coreGetName(b)); });
    html += '<div class="site-block"><span class="site-title">' + site + ' (' + rows.length + ')</span>' + renderRecipeTable(rows) + '</div>';
    });
    html += '</div>';
    });
    html += '</div></div>';
    });
    document.getElementById('accordionWrap').innerHTML = html || '<div class="loading-row">Aucune recette ne correspond aux filtres</div>';
    renderMetrics();
    }
    
    function renderMetrics() {
    var base = visibleList();
    var total = base.length;
    var actives = base.filter(isActive).length;
    var inactives = total - actives;
    var cats = {}; base.forEach(function (r) { cats[coreGetCategory(r)] = true; });
    var sousCount = base.filter(isSousRecette).length;
    var optimisables = 0;
    base.forEach(function (r) { var o = OPTIM_RESULTS[r.id]; if (o && o.length) optimisables++; });
    document.getElementById('metrics').innerHTML =
    '<div class="metric"><div class="ml">Recettes en R&D</div><div class="mv">' + total + '</div></div>' +
    '<div class="metric accent"><div class="ml">Actives</div><div class="mv">' + actives + '</div></div>' +
    '<div class="metric"><div class="ml">Inactives</div><div class="mv">' + inactives + '</div></div>' +
    '<div class="metric"><div class="ml">Categories</div><div class="mv">' + Object.keys(cats).length + '</div></div>' +
    '<div class="metric"><div class="ml">Sous-recettes utilisees</div><div class="mv">' + sousCount + '</div></div>' +
    '<div class="metric' + (optimisables ? ' optim-metric' : '') + '"><div class="ml">Optimisables (estimation)</div><div class="mv">' + optimisables + '</div></div>';
    }

      function getRecipeDetail(id) { return HELPERS.getRecipeDetail(id); }

      function toggleRecipe(id) {
      var row = document.querySelector('.recipe-row[data-id="' + id + '"]');
      if (!row) return;
      var next = row.nextElementSibling;
      var chev = document.getElementById('chev-' + id);
      if (next && next.classList.contains('expand-row')) {
      next.remove();
      if (chev) chev.className = 'ti ti-chevron-right exp-chev';
      return;
      }
      document.querySelectorAll('.expand-row').forEach(function (n) { n.remove(); });
      document.querySelectorAll('.exp-chev').forEach(function (c) { c.className = 'ti ti-chevron-right exp-chev'; });
      if (chev) chev.className = 'ti ti-chevron-down exp-chev';
      var tr = document.createElement('tr');
      tr.className = 'expand-row';
      tr.innerHTML = '<td colspan="4"><div class="exp-wrap"><div class="loading-row">Chargement des ingredients...</div></div></td>';
      row.parentNode.insertBefore(tr, row.nextSibling);
      var r = RECIPE_BY_ID[id];
      HELPERS.getFlatIngredients(r).then(function (rows) {
      tr.querySelector('.exp-wrap').innerHTML = buildExpandHtml(r, rows);
      OPTIM_RESULTS[id] = rows.filter(function (x) { return x.optim; }).map(function (x) { return Object.assign({ ingName: x.name }, x.optim); });
      renderMetrics();
      }).catch(function () {
      tr.querySelector('.exp-wrap').innerHTML = '<div class="loading-row">Erreur de chargement des ingredients</div>';
      });
      }

      function buildExpandHtml(r, rows) {
      var cost = getCostTotal(r);
      var hasOpaque = rows.some(function (x) { return x.opaque; });
      var head = '<div class="exp-head">' +
        '<span>Composants : <b>' + rows.length + '</b></span>' +
      '<span>Cout global HT : <b>' + fmtEUR(cost) + '</b></span>' +
      '</div>';
    if (hasOpaque) {
    head += '<div class="opaque-note"><i class="ti ti-info-circle"></i> Certains composants sont des sous-recettes fabriquees en interne (laboratoire) : le detail de leurs ingredients ne peut pas etre affiche car Inpulse ne l expose pas via son API publique. Ils sont affiches tels quels ci-dessous.</div>';
    }
    var bodyRows = rows.map(function (c) {
    var ing = INGR_BY_ID[c.id];
    var clickable = !c.opaque && ing && Array.isArray(ing.supplierProducts) && ing.supplierProducts.length > 1;
    var optimTag = c.optim ? ' <span class="tag-optim-detail" title="Alternative: ' + escapeHtml(c.optim.supplierProductName) + ' chez ' + escapeHtml(c.optim.supplierName) + ' (estimation)">economie possible ' + fmtPct(c.optim.savingsPct) + '</span>' : '';
    var rowCls = c.opaque ? 'opaque-row' : (clickable ? ('ingr-row' + (c.optim ? ' row-optim' : '')) : (c.optim ? 'row-optim' : ''));
    return '<tr' + (rowCls ? ' class="' + rowCls + '"' : '') + (clickable ? ' data-ing="' + c.id + '"' : '') + '><td>' + (clickable ? '<i class="ti ti-chevron-right ing-chev"></i> ' : '') + escapeHtml(c.name) + (c.opaque ? ' <span class="tag-internal">sous-recette</span>' : '') + optimTag + '</td><td>' + escapeHtml(c.supplier) + '</td><td class="num">' + fmtNum(c.quantity) + '</td><td>' + escapeHtml(c.unit) + '</td><td class="num">' + fmtEUR(c.lineCost) + '</td></tr>';
    }).join('');
    var table = '<div class="tw"><table><colgroup><col style="width:38%"><col style="width:24%"><col style="width:14%"><col style="width:10%"><col style="width:14%"></colgroup><thead><tr><th>Ingredient</th><th>Fournisseur</th><th>Quantite</th><th>Unite</th><th>Cout HT</th></tr></thead><tbody>' +
    (bodyRows || '<tr><td colspan="5" class="loading-row">Aucun composant</td></tr>') + '</tbody></table></div>';
    return head + table;
    }

      function buildIngredientDetailHtml(id) {
      var ing = INGR_BY_ID[id];
      if (!ing) return '<div class="loading-row">Detail non disponible</div>';
      var current = Number(ing.cost);
      var opts = [];
      (ing.supplierProducts || []).forEach(function (ref) {
      var sp = SUPPRODUCT_BY_ID[ref.id];
      if (!sp) return;
      var uc = unitCostOf(sp);
      opts.push({ name: sp.name, supplier: (sp.supplier && sp.supplier.name) || '?', unitCost: uc, active: sp.status === 'active' });
      });
      opts.sort(function (a, b) { return (a.unitCost == null ? 1e9 : a.unitCost) - (b.unitCost == null ? 1e9 : b.unitCost); });
      var rows = opts.map(function (o) {
      var tag = (o.unitCost != null && isFinite(current) && current > 0 && o.unitCost < current * 0.9) ? ' <span class="tag-internal" style="background:#dcfce7;color:#166534">moins cher (estimation)</span>' : '';
        return '<tr' + (!o.active ? ' class="opaque-row"' : '') + '><td>' + escapeHtml(o.name) + tag + '</td><td>' + escapeHtml(o.supplier) + '</td><td class="num">' + '\u2014' + '</td><td>' + '\u2014' + '</td><td class="num">' + (o.unitCost != null ? fmtEUR(o.unitCost) : '\u2014') + '</td></tr>';
      }).join('');
      return '<div class="tw" style="margin:6px 0 6px 24px"><table><colgroup><col style="width:38%"><col style="width:24%"><col style="width:14%"><col style="width:10%"><col style="width:14%"></colgroup><thead><tr><th>Produit fournisseur</th><th>Fournisseur</th><th>Quantite</th><th>Unite</th><th>Cout unitaire (estimation)</th></tr></thead><tbody>' +
      (rows || '<tr><td colspan="5" class="loading-row">Aucune alternative fournisseur enregistree</td></tr>') + '</tbody></table></div>';
      }
      
      function startOptimScan() {
      var idx = 0;
      var total = ALL.filter(belongsRD).length;
      var list = ALL.filter(belongsRD);
      var BATCH = 4;
      function step() {
      if (idx >= total) { render(); return; }
      var batch = list.slice(idx, idx + BATCH);
      idx += BATCH;
      Promise.all(batch.map(function (r) {
      return HELPERS.getFlatIngredients(r).then(function (rows) {
      OPTIM_RESULTS[r.id] = rows.filter(function (x) { return x.optim; }).map(function (x) { return Object.assign({ ingName: x.name }, x.optim); });
      }).catch(function () { OPTIM_RESULTS[r.id] = []; });
      })).then(function () {
      if (idx % (BATCH * 6) === 0 || idx >= total) render();
      step();
      });
      }
      step();
      }

        function getIngName(i) { return i.name || '?'; }
        function getIngCostKg(i) { return (typeof i.cost === 'number') ? i.cost * 1000 : 0; }

        function loadDrafts() { return draftsGetAll().then(function (d) { DRAFTS = d || {}; }); }

        function renderDrafts() {
        var ids = Object.keys(DRAFTS);
        document.getElementById('countTxt2').textContent = ids.length;
        var rows = ids.map(function (id) {
        var d = DRAFTS[id];
        return '<tr><td class="tb">' + escapeHtml(d.name || '') + '</td><td>' + escapeHtml(d.category || '') + '</td><td class="num">' + fmtEUR(d.salePrice || 0) + '</td><td class="num">' + fmtPct(d.foodCostPct || 0) + '</td><td><span class="pill gold">Brouillon</span></td>' +
      '<td><button class="btn btn-sm" onclick="editDraft(\'' + id + '\')">Modifier</button> <button class="btn btn-sm btn-danger" onclick="removeDraft(\'' + id + '\')">Suppr.</button></td></tr>';
      }).join('');
      document.getElementById('tbody2').innerHTML = rows || '<tr><td colspan="6" class="loading-row">Aucun brouillon pour le moment</td></tr>';
      }
      
      function removeDraft(id) {
      if (!confirm('Supprimer ce brouillon ?')) return;
      draftsDelete(id).then(function () { delete DRAFTS[id]; renderDrafts(); toast('Brouillon supprime'); });
      }
      
      function populateFlourOptions() {
      var sel = document.getElementById('f-farine');
      if (!sel) return;
      sel.innerHTML = '<option value="">-- choisir --</option>';
      INGREDIENTS_LIST.filter(function (i) { return getIngName(i).toLowerCase().indexOf('farine') !== -1; }).forEach(function (i) {
      var o = document.createElement('option'); o.value = getIngName(i); o.textContent = getIngName(i); sel.appendChild(o);
      });
      }
      
      function openCreate(id) {
      currentDraftId = id || null;
      var d = id ? DRAFTS[id] : null;
      currentIngredients = d ? (d.ingredients || []).slice() : [];
      var datalistOptions = INGREDIENTS_LIST.map(function (i) { return '<option value="' + escapeHtml(getIngName(i)) + '">'; }).join('');
      var html = '<div class="modal-bg" onclick="if(event.target===this) closeModal()">' +
      '<div class="modal">' +
      '<div class="modal-h"><h2>' + (d ? 'Modifier la recette' : 'Nouvelle recette R&D') + '</h2><button class="btn btn-sm" onclick="closeModal()">Fermer</button></div>' +
      '<div class="grid3">' +
      '<div class="field"><label>Nom de la recette</label><input type="text" id="f-name" value="' + escapeHtml(d ? d.name : '') + '"></div>' +
      '<div class="field"><label>Categorie</label><input type="text" id="f-cat" value="' + escapeHtml(d ? d.category : '') + '" placeholder="ex: SR - PATISSERIE"></div>' +
      '<div class="field"><label>Farine utilisee</label><select id="f-farine"></select></div>' +
      '</div>' +
      '<div class="grid3">' +
      '<div class="field"><label>Qualite</label><select id="f-qualite"><option>A definir</option><option>Standard</option><option>Bio</option><option>Premium</option><option>Local</option></select></div>' +
      '<div class="field"><label>Prix de vente TTC (\u20ac)</label><input type="number" step="0.01" id="f-price" oninput="updateTotals()" value="' + (d ? d.salePrice : '') + '"></div>' +
      '<div class="field"><label>Statut</label><select id="f-status"><option value="dev">En developpement</option><option value="ready">Prete a tester</option></select></div>' +
      '</div>' +
      '<div class="field"><label>Ingredients (nom, grammage en g, prix au kg en \u20ac)</label></div>' +
      '<div id="ingRows"></div>' +
      '<button class="btn btn-sm" type="button" onclick="addIngRow()"><i class="ti ti-plus"></i> Ajouter un ingredient</button>' +
      '<div style="margin-top:16px;padding:12px;background:var(--sur2);border-radius:var(--r)">' +
      '<div style="display:flex;justify-content:space-between;font-size:13px"><span>Food cost brut</span><strong id="fc-eur">0,00 \u20ac</strong></div>' +
      '<div style="display:flex;justify-content:space-between;font-size:13px;margin-top:4px"><span>Food cost %</span><strong id="fc-pct">0,0 %</strong></div>' +
      '<div class="foodcost-bar"><div class="foodcost-fill" id="fc-bar" style="width:0%"></div></div>' +
      '</div>' +
      '<div style="margin-top:16px;display:flex;gap:8px;justify-content:flex-end">' +
      '<button class="btn" onclick="closeModal()">Annuler</button>' +
      '<button class="btn btn-primary" onclick="saveDraft()">Enregistrer le brouillon</button>' +
      '</div>' +
      '<datalist id="ingList">' + datalistOptions + '</datalist>' +
      '</div>' +
      '</div>';
      document.getElementById('modalRoot').innerHTML = html;
      populateFlourOptions();
      if (d && d.flour) document.getElementById('f-farine').value = d.flour;
      if (d && d.quality) document.getElementById('f-qualite').value = d.quality;
      if (d && d.status) document.getElementById('f-status').value = d.status;
      if (!currentIngredients.length) currentIngredients.push({ name: '', grams: 0, costKg: 0 });
      renderIngRows();
      }

        function renderIngRows() {
        var el = document.getElementById('ingRows');
        el.innerHTML = currentIngredients.map(function (row, idx) {
        return '<div class="ing-row">' +
          '<input type="text" list="ingList" placeholder="Ingredient" value="' + escapeHtml(row.name || '') + '" oninput="updateIngRow(' + idx + ',\'name\',this.value)">' +
          '<input type="number" placeholder="Grammes" value="' + (row.grams || '') + '" oninput="updateIngRow(' + idx + ',\'grams\',this.value)">' +
          '<input type="number" step="0.01" placeholder="\u20ac / kg" value="' + (row.costKg || '') + '" oninput="updateIngRow(' + idx + ',\'costKg\',this.value)">' +
          '<div class="num">' + fmtEUR((row.grams || 0) / 1000 * (row.costKg || 0)) + '</div>' +
          '<button type="button" class="rm" onclick="removeIngRow(' + idx + ')">&times;</button>' +
          '</div>';
        }).join('');
        updateTotals();
        }
        function addIngRow() { currentIngredients.push({ name: '', grams: 0, costKg: 0 }); renderIngRows(); }
        function removeIngRow(idx) { currentIngredients.splice(idx, 1); renderIngRows(); }
        function updateIngRow(idx, field, value) {
        currentIngredients[idx][field] = (field === 'name') ? value : Number(value);
        if (field === 'name') {
        var match = INGREDIENTS_LIST.filter(function (i) { return getIngName(i).toLowerCase() === value.toLowerCase(); })[0];
        if (match) currentIngredients[idx].costKg = getIngCostKg(match);
        }
        renderIngRows();
        }
        function updateTotals() {
        var totalCost = currentIngredients.reduce(function (s, r) { return s + (r.grams || 0) / 1000 * (r.costKg || 0); }, 0);
        var priceEl = document.getElementById('f-price');
        var price = priceEl ? (Number(priceEl.value) || 0) : 0;
        var pct = price ? (totalCost / price * 100) : 0;
        document.getElementById('fc-eur').textContent = fmtEUR(totalCost);
        document.getElementById('fc-pct').textContent = fmtPct(pct);
        var bar = document.getElementById('fc-bar');
        bar.style.width = Math.min(pct, 100) + '%';
        bar.className = 'foodcost-fill' + (pct > 35 ? ' bad' : (pct > 25 ? ' warn' : ''));
        }
        function saveDraft() {
        var totalCost = currentIngredients.reduce(function (s, r) { return s + (r.grams || 0) / 1000 * (r.costKg || 0); }, 0);
        var price = Number(document.getElementById('f-price').value) || 0;
        var pct = price ? (totalCost / price * 100) : 0;
        var name = document.getElementById('f-name').value;
        if (!name) { toast('Merci d indiquer un nom de recette'); return; }
        var draft = {
        id: currentDraftId || undefined,
        name: name,
        category: document.getElementById('f-cat').value,
        flour: document.getElementById('f-farine').value,
        quality: document.getElementById('f-qualite').value,
        status: document.getElementById('f-status').value,
        salePrice: price,
        foodCostEur: totalCost,
        foodCostPct: pct,
        ingredients: currentIngredients
        };
        draftsSave(draft).then(function (resp) {
        var id = resp.id || draft.id;
        DRAFTS[id] = draft;
        closeModal();
        renderDrafts();
        toast('Brouillon enregistre');
        });
        }
        function editDraft(id) { openCreate(id); }
        function closeModal() { document.getElementById('modalRoot').innerHTML = ''; }

        document.getElementById('catFilter').addEventListener('change', render);
        document.getElementById('search').addEventListener('input', debounce(render, 200)); loadAll(); </script> </body> </html>
