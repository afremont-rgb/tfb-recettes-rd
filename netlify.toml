[build]
functions = "netlify/functions"

[[redirects]]
from = "/api/proxy"
to = "/.netlify/functions/proxy"
status = 200
force = true

[[redirects]]
from = "/api/quality"
to = "/.netlify/functions/quality"
status = 200
force = true

[[redirects]]
from = "/api/drafts"
to = "/.netlify/functions/drafts"
status = 200
force = true


[[redirects]]
from = "/api/price-override"
to = "/.netlify/functions/price-override"
status = 200
force = true

[[redirects]]
from = "/api/hidden-recipes"
to = "/.netlify/functions/hidden-recipes"
status = 200
force = true
